spring.application.name=DIAW-Portfolio

# Variáveis locais (RESEND_API_KEY etc.) podem ficar em um arquivo .env na raiz
spring.config.import=optional:file:.env[.properties]

# Internacionalização: sem fallback para o idioma do sistema operacional
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Envio de e-mail do formulário de contato (Resend)
resend.api-key=${RESEND_API_KEY:}
contato.remetente=${CONTATO_REMETENTE:Portfólio <onboarding@resend.dev>}
contato.destinatario=${CONTATO_DESTINATARIO:felipefonseca2006@gmail.com}

# Sessão apenas por cookie (evita ;jsessionid nas URLs)
server.servlet.session.tracking-modes=cookie

# Servidor: o Render informa a porta pela variável PORT e fica atrás de um proxy HTTPS
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,image/svg+xml
server.error.include-stacktrace=never

# Arquivos estáticos versionados pelo conteúdo (ex.: style-3f2a.css) e com cache longo
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
