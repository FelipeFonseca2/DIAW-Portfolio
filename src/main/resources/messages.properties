sobre.bio.1=Sou estudante do 4º período de Engenharia de Software na PUC Minas, campus Coração Eucarístico, onde ingressei em 2025. Venho construindo minha base em programação com C, C++, C#, Java e Python, estruturas de dados, programação orientada a objetos e desenvolvimento web.
sobre.bio.2=Tenho interesse tanto em back-end quanto em front-end, além de inteligência artificial e hardware. Busco um estágio na área de desenvolvimento e tecnologia para aprender, aplicar meus conhecimentos técnicos e evoluir profissionalmente.

