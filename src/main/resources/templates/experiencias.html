<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Experiências', 'Formação acadêmica, projetos e cursos de Felipe Fonseca, estudante de Engenharia de Software na PUC Minas.')}"></head>

<body>
	<header th:replace="~{fragments/layout :: header}"></header>

	<main id="conteudo" class="container" tabindex="-1">
		<section>
			<div class="section-head">
				<h2>Experiências</h2>
				<p class="section-sub">Formação acadêmica, projetos desenvolvidos na graduação e cursos.</p>
			</div>

			<section class="grupo-experiencia" th:each="grupo : ${grupos}"
				th:aria-labelledby="'grupo-' + ${grupo.key.name()}">
				<h3 class="grupo-titulo" th:id="'grupo-' + ${grupo.key.name()}">
					<i class="bi" th:classappend="${grupo.key.icone}"></i>
					<span th:text="${grupo.key.titulo}">Tipo</span>
				</h3>

				<div class="experiencias">
					<article class="card experiencia reveal" th:each="exp : ${grupo.value}">
						<div class="experiencia-head">
							<div>
								<h4 th:text="${exp.cargo()}">Cargo</h4>
								<p class="experiencia-org" th:text="${exp.instituicao()}">Instituição</p>
							</div>
							<span class="badge" th:if="${exp.periodo() != null}" th:classappend="${exp.emAndamento()} ? 'badge-atual'"
								th:text="${exp.periodo()}">2026 – atual</span>
						</div>
						<p th:text="${exp.descricao()}">Descrição</p>
						<ul class="tags" th:if="${!#lists.isEmpty(exp.competencias())}" aria-label="Competências">
							<li th:each="comp : ${exp.competencias()}" th:text="${comp}">Java</li>
						</ul>
					</article>
				</div>
			</section>
		</section>
	</main>

	<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
