<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
	th:with="ingles=${#locale.language == 'en'}" th:lang="${ingles} ? 'en' : 'pt-BR'">

<head th:replace="~{fragments/layout :: head(#{sobre.titulo})}"></head>

<body>
	<header th:replace="~{fragments/layout :: header}"></header>

	<main class="container">
		<section class="hero">
			<div class="hero-text">
				<p class="eyebrow" th:text="#{sobre.saudacao}">Olá, eu sou</p>
				<h1>Felipe Fonseca</h1>
				<p class="hero-role" th:text="#{sobre.cargo}">Estudante de Engenharia de Software · PUC Minas</p>
				<div class="hero-actions">
					<a class="btn btn-primary" th:href="@{/projetos}" th:text="#{sobre.verProjetos}">Ver projetos</a>
					<a class="btn btn-outline" th:href="@{/contato}" th:text="#{sobre.contato}">Entrar em contato</a>
				</div>
			</div>
			<img class="hero-photo" th:src="@{/img/felipe.webp}" th:alt="#{sobre.foto}" width="220" height="220">
		</section>

		<section class="sobre">
			<div class="section-head">
				<h2 th:text="#{sobre.titulo}">Sobre Mim</h2>
				<nav class="lang-switch" th:aria-label="#{sobre.idioma}">
					<a th:href="@{/(lang=pt)}" hreflang="pt-BR" lang="pt-BR"
						th:attr="aria-current=${!ingles} ? 'true'">PT</a>
					<a th:href="@{/(lang=en)}" hreflang="en" lang="en"
						th:attr="aria-current=${ingles} ? 'true'">EN</a>
				</nav>
			</div>

			<article class="card bio">
				<p th:text="#{sobre.bio.1}">Bio</p>
				<p th:text="#{sobre.bio.2}">Bio</p>
			</article>

			<div class="info-grid">
				<div class="card info">
					<i class="bi bi-mortarboard"></i>
					<h3 th:text="#{sobre.formacao}">Formação</h3>
					<p th:text="#{sobre.formacao.texto}"></p>
				</div>
				<div class="card info">
					<i class="bi bi-code-slash"></i>
					<h3 th:text="#{sobre.area}">Área de atuação</h3>
					<p th:text="#{sobre.area.texto}"></p>
				</div>
				<div class="card info">
					<i class="bi bi-stars"></i>
					<h3 th:text="#{sobre.interesses}">Interesses</h3>
					<p th:text="#{sobre.interesses.texto}"></p>
				</div>
				<div class="card info">
					<i class="bi bi-flag"></i>
					<h3 th:text="#{sobre.objetivos}">Objetivo</h3>
					<p th:text="#{sobre.objetivos.texto}"></p>
				</div>
				<div class="card info">
					<i class="bi bi-translate"></i>
					<h3 th:text="#{sobre.idiomas}">Idiomas</h3>
					<p th:text="#{sobre.idiomas.texto}"></p>
				</div>
				<div class="card info">
					<i class="bi bi-clock"></i>
					<h3 th:text="#{sobre.disponibilidade}">Disponibilidade</h3>
					<p th:text="#{sobre.disponibilidade.texto}"></p>
				</div>
			</div>

			<div class="card habilidades">
				<h3 th:text="#{sobre.habilidades}">Habilidades e Competências</h3>
				<div class="habilidades-grid">
					<div th:each="grupo : ${ {'linguagens', 'web', 'ferramentas', 'conceitos', 'competencias'} }">
						<h4 th:text="#{${'sobre.hab.' + grupo}}">Grupo</h4>
						<ul class="tags">
							<li th:each="item : ${#strings.arraySplit(#messages.msg('sobre.hab.' + grupo + '.itens'), ';')}"
								th:text="${item}">Item</li>
						</ul>
					</div>
				</div>
			</div>
		</section>
	</main>

	<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>

</html>
