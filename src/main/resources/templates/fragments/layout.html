<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Portfólio profissional de Felipe Fonseca">
	<title th:text="${titulo} + ' | Felipe Fonseca'">Felipe Fonseca</title>
	<link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<script>
		// Aplica o tema salvo antes da renderização para evitar "flash" de cor.
		try {
			const tema = localStorage.getItem("tema");
			if (tema) document.documentElement.dataset.theme = tema;
		} catch (e) {}
	</script>
	<script th:src="@{/js/main.js}" defer></script>
</head>

<body>

	<header class="site-header" th:fragment="header">
		<div class="container header-inner">
			<a class="logo" th:href="@{/}" aria-label="Página inicial">
				<span class="logo-mark">FF</span>
				<span class="logo-text">Felipe Fonseca</span>
			</a>

			<button class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">
				<i class="bi bi-list"></i>
			</button>

			<nav id="menu" class="nav" aria-label="Navegação principal">
				<a th:href="@{/}" th:classappend="${pagina == 'sobre'} ? 'ativo'"
					th:attr="aria-current=${pagina == 'sobre'} ? 'page'">Sobre Mim</a>
				<a th:href="@{/projetos}" th:classappend="${pagina == 'projetos'} ? 'ativo'"
					th:attr="aria-current=${pagina == 'projetos'} ? 'page'">Projetos</a>
				<a th:href="@{/experiencias}" th:classappend="${pagina == 'experiencias'} ? 'ativo'"
					th:attr="aria-current=${pagina == 'experiencias'} ? 'page'">Experiências</a>
				<a th:href="@{/contato}" th:classappend="${pagina == 'contato'} ? 'ativo'"
					th:attr="aria-current=${pagina == 'contato'} ? 'page'">Contato</a>
				<button class="theme-toggle" type="button" aria-label="Alternar tema claro/escuro">
					<i class="bi bi-circle-half"></i>
				</button>
			</nav>
		</div>
	</header>

	<footer class="site-footer" th:fragment="footer">
		<div class="container footer-inner">
			<p>&copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> Felipe Fonseca</p>
			<div class="footer-links">
				<a href="https://github.com/FelipeFonseca2" target="_blank" rel="noopener" aria-label="GitHub"><i class="bi bi-github"></i></a>
				<a href="https://www.linkedin.com/in/felipe-fonseca-31924b374" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
				<a href="https://wa.me/5531999667897" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="bi bi-whatsapp"></i></a>
				<a href="https://www.instagram.com/f_c_fonseca" target="_blank" rel="noopener" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
				<a href="mailto:felipefonseca2006@gmail.com" aria-label="E-mail"><i class="bi bi-envelope"></i></a>
			</div>
		</div>
	</footer>

</body>

</html>
