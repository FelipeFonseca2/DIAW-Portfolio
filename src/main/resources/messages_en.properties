sobre.bio.1=I'm a fourth-semester Software Engineering student at PUC Minas (Coração Eucarístico campus) in Belo Horizonte, Brazil, which I joined in 2025. I've been building my programming foundation with C, C++, C#, Java and Python, data structures, object-oriented programming and web development.
sobre.bio.2=I'm interested in both back-end and front-end, as well as artificial intelligence and hardware. I'm looking for an internship in software development and technology where I can learn, apply my technical knowledge and grow professionally.

